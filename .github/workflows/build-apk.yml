name: Build and Release DARLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DARLY-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DARLY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DARLY ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
